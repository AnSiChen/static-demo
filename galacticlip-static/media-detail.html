<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Media Detail — Galacticlip Static Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-shell">
    <div>
      <p class="demo-meta"><strong>Galacticlip static UI demo.</strong> A browser representation of the original .NET MAUI application. NASA media imagery shown in this demo is sourced from NASA.</p>
      <section class="phone" aria-label="Galacticlip media detail demo">
        <div class="status-bar"><span>9:41</span><span class="status-icons"><i class="status-dot"></i><i class="status-dot"></i><i class="status-dot"></i><i class="status-battery"></i></span></div>
        <div class="app">
          <main class="app-content" style="bottom:0"><section class="detail-page" data-detail-root></section></main>
          <div class="toast" role="status" aria-live="polite"></div>
        </div>
      </section>
    </div>
  </div>
  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
