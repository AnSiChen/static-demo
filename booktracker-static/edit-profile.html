<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css?family=Merriweather:400,700|Open+Sans:400,700&display=swap" rel="stylesheet">

<header>
  <div class="logo-container"><a href="home.html"><img src="assets/logo.png" alt="Book Tracker Logo" class="logo"></a></div>
  <nav class="container"><ul>
    <li><a href="home.html">Home</a></li>
    <li><a href="dashboard.html">Dashboard</a></li>
    <li><a href="index.html" id="logout-link">Logout</a></li>
    <li class="user-info"><a href="edit-profile.html"><strong>@bug</strong></a></li>
  </ul></nav>
  <div class="container search-container">
    <form class="global-search-form" action="search.html">
      <label for="book-search" class="hidden">Search books</label>
      <input type="text" id="book-search" name="q" placeholder="Search books...">
      <button type="button" onclick="location.href='explore.html'" class="button-highlight">Explore</button>
    </form>
    <div id="search-results"></div>
  </div>
</header><main><div class="edit-profile-container"><h2 class="form-heading">Edit Profile</h2><form class="edit-profile-form static-edit-profile-form"><p><label for="edit-bio">Bio:</label><textarea id="edit-bio">Curious reader keeping a small record of books and notes.</textarea></p><p><label for="edit-location">Location:</label><input id="edit-location" type="text" value="Adelaide"></p><p><label for="edit-birth">Birth date:</label><input id="edit-birth" class="static-field" type="date" value="1994-08-18"></p><p><label for="edit-photo">Profile photo:</label><input id="edit-photo" class="static-field" type="file" disabled><span class="form-help">Disabled in the static representation.</span></p><button type="submit" class="btn btn-primary">Save changes</button></form></div></main>
