<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Static UI representation of the Book Tracker Django application.">
<title>Edit Book | Book Tracker Demo</title>
<link href="https://fonts.googleapis.com/css?family=Merriweather:400,700|Open+Sans:400,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="assets/favicon.ico" type="image/x-icon">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180">
</head><body>
<header>
  <div class="logo-container"><a href="home.html"><img src="assets/logo.png" alt="Book Tracker Logo" class="logo"></a></div>
  <nav class="container"><ul>
    <li><a href="home.html">Home</a></li>
    <li><a href="dashboard.html">Dashboard</a></li>
    <li><a href="index.html" id="logout-link">Logout</a></li>
    <li class="user-info"><a href="edit-profile.html"><strong>@bug</strong></a></li>
  </ul></nav>
  <div class="container search-container">
    <form class="global-search-form" action="search.html">
      <label for="book-search" class="hidden">Search books</label>
      <input type="text" id="book-search" name="q" placeholder="Search books...">
      <button type="button" onclick="location.href='explore.html'" class="button-highlight">Explore</button>
    </form>
    <div id="search-results"></div>
  </div>
</header><main><div class="edit-book-container"><h2 class="form-heading">Edit Book</h2><form class="edit-book-form static-edit-book-form"><p><label for="edit-title">Title:</label><input id="edit-title" name="title"></p><p><label for="edit-author">Author:</label><input id="edit-author" name="author"></p><p><label for="edit-isbn">ISBN:</label><input id="edit-isbn" name="isbn"></p><p><label for="edit-pages">Pages:</label><input id="edit-pages" class="static-field" type="number" name="pages"></p><p><label for="edit-date">Publication date:</label><input id="edit-date" class="static-field" type="date" name="publication_date"></p><p><label for="edit-summary">Summary:</label><textarea id="edit-summary" name="summary"></textarea></p><button type="submit" class="btn btn-primary">Save Changes</button></form></div></main>
<footer><div class="container"><nav><ul>
  <li><a href="add-book.html">Add Book</a></li>
  <li><a href="home.html">Home</a></li>
  <li><a href="dashboard.html">Dashboard</a></li>
</ul></nav>
